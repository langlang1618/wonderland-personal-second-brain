[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-knowledge-pipeline"
version = "0.1.0"
description = "Local-first AI knowledge pipeline for turning media sources into structured Markdown knowledge bases."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "AI Knowledge Pipeline Maintainers" },
]
keywords = [
  "ai",
  "knowledge-management",
  "obsidian",
  "pipeline",
  "rag",
  "transcription",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

# Future CLI entrypoint.
# Enable after ai_knowledge_pipeline.cli exposes a callable main function.
#
# [project.scripts]
# ai-knowledge-pipeline = "ai_knowledge_pipeline.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_knowledge_pipeline*"]
exclude = ["tests*", "docs*", "configs*", "data*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "--strict-config",
  "--strict-markers",
]
